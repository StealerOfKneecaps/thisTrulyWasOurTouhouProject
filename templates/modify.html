<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Modify Firms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success" role="alert">
                {{ success }}
            </div>
            {% endif %}

            <div class="card shadow-sm">
                <div class="card-body">

                    <h3 class="text-center mb-1">Add a Firm</h3>
                    <p class="text-center text-muted mb-4">Admin only</p>

                    <form method="POST">
                        <input type="hidden" name="action" value="addFirm">

                        <div class="mb-3">
                            <label class="form-label">Firm Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Base Rate</label>
                            <input type="number" step="0.01" name="baseRate" class="form-control" required>
                        </div>

                        <hr>
                        <p class="text-muted small mb-3">The rates below are multiplied by the user's input and added to the base rate.</p>

                        <div class="row">
                            <div class="col mb-3">
                                <label class="form-label">Age Rate</label>
                                <input type="number" step="0.01" name="ageRate" class="form-control" required>
                            </div>
                            <div class="col mb-3">
                                <label class="form-label">Salary Rate</label>
                                <input type="number" step="0.0001" name="salaryRate" class="form-control" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col mb-3">
                                <label class="form-label">Travel Duration Rate</label>
                                <input type="number" step="0.01" name="travelDurationRate" class="form-control" required>
                            </div>
                            <div class="col mb-3">
                                <label class="form-label">People Traveling Rate</label>
                                <input type="number" step="0.01" name="peopleTravelRate" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Existing Medical Condition Rate (flat fee)</label>
                            <input type="number" step="0.01" name="existMedCondRate" class="form-control" required>
                        </div>

                        <hr>

                        <div class="mb-4">
                            <label class="form-label d-block">Coverage</label>
                            <div class="form-text mb-2">Select all coverage types this firm offers.</div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="coverageA" id="coverageA" value="1">
                                <label class="form-check-label" for="coverageA">A</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="coverageB" id="coverageB" value="1">
                                <label class="form-check-label" for="coverageB">B</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="coverageC" id="coverageC" value="1">
                                <label class="form-check-label" for="coverageC">C</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="coverageD" id="coverageD" value="1">
                                <label class="form-check-label" for="coverageD">D</label>
                            </div>
                        </div>


                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Add Firm
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <h3 class="text-center mb-1">Reset a User's Password</h3>
                    <p class="text-center text-muted mb-4">Admin only</p>

                    <form method="POST">
                        <input type="hidden" name="action" value="resetPassword">

                        <div class="mb-3">
                            <label class="form-label">User Email</label>
                            <input type="email" name="resetEmail" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="newPassword" class="form-control" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Reset Password
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <p class="text-center mt-3">
                <a href="/resultsPage" class="text-muted small">Back to results</a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
