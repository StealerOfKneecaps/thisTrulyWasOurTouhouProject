<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quote Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Available Premiums</h2>

    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="card shadow-sm">
                <div class="card-body">

                    <table class="table table-bordered text-center align-middle">

                        <thead class="table-light">
                            <tr>
                                <th>Firm</th>
                                <th>Price</th>
                                <th>Coverage</th>
                            </tr>
                        </thead>

                        <tbody>
                            {%for r in results%}
                            <tr>
                                <td>{{r.name}}</td>
                                <td>{{r.price}}</td>
                                <td>{{r.coverage | join(", ")}}</td>
                            </tr>
                            {%endfor%}
                        </tbody>
                    </table>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-between mt-4">

                        <a href="/quote" class="btn btn-outline-secondary">
                            Clear My Information
                        </a>

                        <!-- ADMIN ONLY -->
                        {%if id == 1%}
                        <a href="/modify" class="btn btn-warning">
                            Modify
                        </a>
                        {%endif%}

                    </div>
                    
                    {%if error%}
                    <div class="alert alert-danger mt-2" role = "alert">
                        {{error}}
                    </div>
                    {%endif%}

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
